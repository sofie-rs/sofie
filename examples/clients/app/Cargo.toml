[package]
name = "clients-demo"
description = "Example app: the same screens compiled into a Svelte area and a React area."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dependencies]
notes = { path = "../modules/notes" }
sofie = { workspace = true, features = ["clients", "compression"] }

[build-dependencies]
sofie-cli.workspace = true

[dev-dependencies]
sofie-testing.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
