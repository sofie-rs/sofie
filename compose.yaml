# Development and test database only. Port 25432 keeps it clear of other
# local Postgres instances.
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: sofie-postgres
    environment:
      POSTGRES_USER: sofie
      POSTGRES_PASSWORD: sofie
      POSTGRES_DB: sofie
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - sofie-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofie -d sofie"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  sofie-postgres:
