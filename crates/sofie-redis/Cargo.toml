[package]
name = "sofie-redis"
description = "One Redis connection pool shared by an app's framework features and its own code, over a small RESP client."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# `fake::FakeRedis`: a Redis speaking RESP2 on a local socket, for other crates' tests.
testing = []

[dependencies]
bytes.workspace = true
rustls.workspace = true
sofie-core.workspace = true
sofie-db = { workspace = true, features = ["contracts"] }
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
tokio-rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
sofie-sqlite = { path = "../sofie-sqlite" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
