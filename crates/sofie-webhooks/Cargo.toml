[package]
name = "sofie-webhooks"
description = "Outgoing webhooks: the endpoints an owner registers hear the events they subscribe to, signed as Standard Webhooks and retried for about a day."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
sofie = { workspace = true, features = ["jobs", "retention", "signed-links", "soft-delete"] }
sofie-client.workspace = true
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true

[dev-dependencies]
ring.workspace = true
sofie = { package = "sofie-framework", path = "../sofie", features = ["capture", "sqlite"] }
serde_json.workspace = true
sofie-testing.workspace = true
tokio = { workspace = true, features = ["macros", "sync"] }

[lints]
workspace = true
