[package]
name = "islands-demo"
description = "Example app: Svelte islands, typed props and `sofie dev`."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
board = { path = "../modules/board" }
sofie = { workspace = true, features = ["islands", "compression"] }

[build-dependencies]
sofie-cli.workspace = true

[dev-dependencies]
sofie-testing.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
