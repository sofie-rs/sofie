<Section id="passkeys" title={t("identity.passkeys.title")}>
  <p>{t("identity.passkeys.intro")}</p>
  <Table id="passkey-list" of={data.passkeys} columns="created_at last_used_at" as="passkey">
    <Action post="passkeys/{passkey.id}/remove" label={t("identity.passkeys.remove")} target="passkeys" />
  </Table>
  <button type="button" data-sofie-passkey="create" data-options={data.options} data-post="passkeys">{t("identity.passkeys.add")}</button>
</Section>
