[package]
name = "sofie-identity-unverified"
description = "Tests sofie-identity built without `email-verification`, which its own tests always turn on."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# Only `cargo test -p sofie-identity-unverified` leaves `email-verification` off: a workspace
# run unifies the features of every crate it builds. The tests hold on either path.
[dev-dependencies]
sofie.workspace = true
sofie-identity = { workspace = true, features = ["password-reset", "sign-in-links"] }
sofie-testing = { workspace = true, features = ["mail"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
