[package]
name = "islands-demo"
description = "Example app: Svelte islands, typed props, a socket and `sofie dev`."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dependencies]
board = { path = "../modules/board" }
sofie = { workspace = true, features = ["islands", "compression", "socket"] }

[build-dependencies]
sofie-cli.workspace = true

[dev-dependencies]
sofie-testing = { workspace = true, features = ["socket"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
