[package]
name = "sofie-content"
description = "Markdown pages with slugs, publishing, search and link-preview tags, and a sitemap: the content an app opts into."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `admin_routes`: pages listed, written, published and withdrawn in an area of the app.
admin = ["sofie/resources"]

[dependencies]
sofie = { workspace = true, features = ["codes", "content", "contracts", "web"] }

[build-dependencies]
sofie-engine = { workspace = true, features = ["compile"] }

[dev-dependencies]
# Its own admin screens, so their tests run in every test run.
sofie-content = { path = ".", features = ["admin"] }
# Spans give route names; its SQLite tables checked against its records.
sofie = { workspace = true, features = ["capture", "sqlite"] }
sofie-testing.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
